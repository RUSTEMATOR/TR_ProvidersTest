name: Script

on:
  workflow_dispatch:
    inputs:
        deployment_target:
          description: Choose target
          required: true
          type: choice
          options:
            - Run tests

jobs:
  vpn-e2e-test:
    runs-on: self-hosted

    timeout-minutes: 700

    steps:
    - name: 🛒 Checkout repo
      uses: actions/checkout@v3

    - name: 🔧 Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: 📦 Install dependencies
      run: npm ci

    - name: 📥 Install Playwright Browsers
      run: npx playwright install chromium --only-shell

    - name: ✅ Run VPN tests
      run: npx playwright test
      # Replace with your actual test path

    - name: 📤 Upload screenshots on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gathered-screenshots
        path: Screenshots/
        retention-days: 3
